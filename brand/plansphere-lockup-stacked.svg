    <circle cx="64" cy="64" r="30" fill="url(#sphere)"/>
    <g clip-path="url(#globe)" fill="none" stroke="#CFF6FA" stroke-opacity="0.26" stroke-width="1.1">
      <ellipse cx="64" cy="64" rx="11" ry="30"/><ellipse cx="64" cy="64" rx="22.5" ry="30"/>
      <path d="M32 50Q64 58 96 50"/><path d="M32 64Q64 72 96 64"/><path d="M32 78Q64 86 96 78"/>
    </g>
    <circle cx="64" cy="64" r="30" fill="none" stroke="#07223C" stroke-opacity="0.35" stroke-width="1"/>
    <g clip-path="url(#globe)"><g transform="rotate(-16 64 64)"><path d="M64 64C46 40 10 40 10 64C10 88 46 88 64 64C82 40 118 40 118 64C118 88 82 88 64 64Z" fill="none" stroke="#062038" stroke-opacity="0.5" stroke-width="11" stroke-linecap="round" mask="url(#fronthalf)"/></g></g>
    <g transform="rotate(-16 64 64)"><path d="M64 64C46 40 10 40 10 64C10 88 46 88 64 64C82 40 118 40 118 64C118 88 82 88 64 64Z" fill="none" stroke="url(#front)" stroke-width="6.2" stroke-linecap="round" mask="url(#fronthalf)"/></g>
    <circle cx="64" cy="64" r="9.5" fill="#FF8A47" fill-opacity="0.18"/>
    <circle cx="64" cy="64" r="5.4" fill="#FF8A47"/>
