  <text x="220" y="242" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" letter-spacing="-1.6" fill="#0B2038"><tspan font-weight="500">Plan</tspan><tspan font-weight="700">Sphere</tspan></text>
  <text x="220" y="280" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="500" letter-spacing="2.4" fill="#5A7A93">PLAN INFINITY AND TRAVEL BEYOND THE WORLD</text>
