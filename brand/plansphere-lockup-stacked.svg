<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 306" width="880" height="612" role="img" aria-label="PlanSphere - Plan Infinity and Travel Beyond the World.">
  <title>PlanSphere stacked lockup</title>
  <defs>
    <radialGradient id="sphere" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#5FE0EC"/><stop offset="0.38" stop-color="#1594B6"/><stop offset="1" stop-color="#08294A"/></radialGradient>
    <linearGradient id="front" x1="60" y1="70" x2="120" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7FE9D8"/><stop offset="1" stop-color="#1FA9CE"/></linearGradient>
    <linearGradient id="back" x1="8" y1="60" x2="66" y2="66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#12456E"/><stop offset="1" stop-color="#1E86A8"/></linearGradient>
    <clipPath id="globe"><circle cx="64" cy="64" r="30"/></clipPath>
    <mask id="fronthalf" maskUnits="userSpaceOnUse" x="60" y="-40" width="140" height="220"><rect x="64" y="-40" width="136" height="220" fill="#fff"/></mask>
  </defs>
  <g transform="translate(140 8) scale(1.25)">
